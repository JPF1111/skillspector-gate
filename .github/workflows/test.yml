name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hash-locale:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Generate en_US.UTF-8 locale
        if: runner.os == 'Linux'
        run: sudo locale-gen en_US.UTF-8
      - name: Locale-independent skill hash
        run: bash tests/test-hash-locale.sh
